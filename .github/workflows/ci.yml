name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- '*.mapper.dart'
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: git diff --check -- . ':(exclude)lib/core/serialization/mappers.init.dart' ':(exclude,glob)**/*.mapper.dart'
